- capability_id: cap.intelligent-investor-4e.stock-bond-allocation
  revision: 2
  status: active
  slug: stock-bond-allocation-skill
  title: 股债25%~75%配置与再平衡纪律
  importance: critical
  importance_rationale: 防御型第一决策（task-02/08）；避免越涨越买的核心机械纪律；否定"100−年龄"公式等流行错误
  one_liner: 股债标准对半开，区间25%~75%，每6个月或比例越界5个百分点时再平衡
  intents:
  - 决定股债比例
  - 建立再平衡规则
  - 全仓股票前自查
  - 抗通胀资产安排
  keywords:
  - 股债配比
  - 再平衡
  - 对半开
  - 仓位
  - asset allocation
  - rebalancing
  - 100减年龄
  also_read:
  - market-valuation-check-skill
  - dca-index-portfolio
  - investor-type-selfcheck-skill
  card: cards/stock-bond-allocation-skill.md
  frontmatter:
    description: 当用户问"股债怎么配""涨多了要不要减仓/再平衡""要不要全仓股票""跌了要不要加仓"时使用：输出25%~75%区间配置+对半开基准+越界5个百分点（或涨至55%卖十一分之一）的再平衡触发+全仓股票六项前置条件自查。只管大类比例与机械再平衡，不做情绪安抚、不做行情判断、不做单只股票决策；比例数值须按当期无风险利率重标定。
    tags:
