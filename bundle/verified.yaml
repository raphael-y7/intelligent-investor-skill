  promotion:
    destination: promoted
    gate:
      independent_intent: true
      independent_contract: true
      independent_run: true
      independent_reuse: true
      independent_eval: true
    notes: 配置决策可独立完成并可核验输出结构
- capability_id: cap.intelligent-investor-4e.market-valuation-check
  revision: 2
  status: active
  slug: market-valuation-check-skill
  title: 市场整体估值检查
  importance: high
  importance_rationale: task-06；格雷厄姆1948-1972五次示范的核心工具（表3-3股债收益比），决定股债比例倾向与买入时机纪律
  one_liner: 用组合盈利收益率vs高等级债息、三因子预期回报、PE分级给大盘定贵贱，再给仓位倾向
  intents:
  - 判断大盘整体贵不贵
  - 现在能不能入场
  - 估算股市长期预期回报
  keywords:
  - 大盘估值
  - 市场估值
  - 股债收益比
  - 希勒市盈率
  - 预期回报
  - market valuation
  - Shiller PE
  also_read:
  - stock-bond-allocation-skill
  - mr-market-discipline-skill
  card: cards/market-valuation-check-skill.md
  frontmatter:
    description: 当用户问"现在大盘贵不贵""指数能不能买""股市长期年化能有多少""专家给的点位预测可信吗"时使用：以盈利收益率≥债券利率为主尺+三因子（实际增长+通胀+股息）回报锚+PE分级，输出高估/合理/低估判断书与股债比例倾向，并用可算指标替代点位预测。本身不做点位预测；数据须用当期市场。
