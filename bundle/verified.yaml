- capability_id: cap.intelligent-investor-4e.mr-market-discipline
  revision: 2
  status: active
  slug: mr-market-discipline-skill
  title: 市场先生波动应对纪律
  importance: critical
  importance_rationale: 巴菲特指定全书最重要两章之一（第8章，task-07）；A股散户最大痛点追涨杀跌的对症药；兹威格称寓言段为全书最重要一段话
  one_liner: 报价是可拒绝的服务：不因涨买跌卖；暴跌=机会；组合波动预期先按+50%/−1/3备课
  intents:
  - 面对暴跌怎么办
  - 涨了想追怎么办
  - 克服追涨杀跌
  - 拿不住股票
  keywords:
  - 市场先生
  - 波动
  - 追涨杀跌
  - 择时
  - Mr. Market
  - timing
  - volatility
  also_read:
  - safety-margin-engine-skill
  - market-valuation-check-skill
  card: cards/mr-market-discipline-skill.md
  frontmatter:
    description: 当用户大跌后恐慌想割肉、大涨后追高冲动、盯盘手痒、或问"要不要择时/该不该信买卖信号"时使用：输出涨时/跌时各一套三问检查表+择时vs估价二分+组合波动预期（比低点+50%、比高点−1/3）+五件可控之事清单。只管"当下的情绪与操作冲动"：不做股债比例调整（属配置卡）、不做大盘水位测算（属估值卡）、不做亏损回本数学（属安全边际卡）。不提供任何市场预测。
