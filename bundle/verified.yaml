schema_version: 1
bundle_id: bundle.intelligent-investor-4e
book:
  title: 聪明的投资者（第4版，注疏点评版）
  author: 本杰明·格雷厄姆 著；贾森·兹威格、沃伦·巴菲特 注疏点评
  source_pack: books/intelligent-investor-4e
  baseline_tag: v1-first-distill
entry:
  name: intelligent-investor-skill
  description: 《聪明的投资者（第4版注疏点评版）》方法论入口：先自测投资者类型（防御/积极/投机隔离），再沿配置→选股→估值→安全边际→波动纪律的路线执行格雷厄姆体系；含兹威格点评的现代行为纪律。用于股票投资分析辅助，输出决策规则而非预测。
  core_principles:
  - 投资操作以深入分析为基础，确保本金安全并获得适当回报；不满足即是投机
  - 投资者只有防御型与积极型两类、无中间态；类型由知识、精力与性格决定
  - 未来不可预测：凡以预测为基础的方法（择时、追趋势、程式方案）终将自我衰减
  - 价格波动只有一个意义：大跌后是买入机会、大涨后是卖出机会；报价是可拒绝的服务
  - 一切稳健投资归结为安全边际：盈利能力显著高于债券利率，或市价显著低于评估价值
  - 用可计量的统计标准与会计警惕落实保护；分母一律多年平均利润
  - 股债25%~75%区间对半开+再平衡+定投等机械纪律是对抗人性的工具
  out_of_scope:
  - 不预测市场点位、不荐股、不承诺收益
  - 不含美国税制（附录2-3）、认股权证文化等制度性内容
  - 书中具体数值（22.5/15倍/1.5倍等）为1972/2003年美国参数，仅保留结构，跨市场使用须按当期利率重标定
  stop_conditions:
  - 当用户要求预测涨跌或点位时，停止并转入市场先生/安全边际纪律框架
  - 当缺少多年利润、利率等必要输入时，先索取数据，不得以单年数据代替
  - 当用户身份不满足积极型预检（时间/精力/性格）时，只输出防御型路线
router_entry:
  name: intelligent-investor-skill-router
  description: 《聪明的投资者》来源路由入口：覆盖定投指数、积极型三策略（低市盈率/net-net/套利）、格雷厄姆估值公式、成对公司比较、泡沫与新股免疫、基金挑选、可转债怀疑框架、股息与股东行动、投资顾问尽调等专项能力；当问题落在这九类具体场景时经本入口到达对应能力卡。
promotion_budget: 8
